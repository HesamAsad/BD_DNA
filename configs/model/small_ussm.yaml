# Parameter-matched causal Mamba-2 baseline for the existing 100M BiSSM.
# The same model supports either algo=bd3lm_ussm (causal block denoising) or
# algo=ar with algo.backbone=ussm (standard next-nucleotide modeling).
name: small_ussm
type: ussm
hidden_size: 768
cond_dim: 128
length: 8192
n_blocks: 12
n_heads: 12
scale_by_sigma: True
dropout: 0.0
tie_word_embeddings: True
adaln: False
attn_backend: none

ssm_state_size: 64
ssm_conv_size: 4
ssm_expand: 2
ssm_head_dim: 64
ssm_chunk_size: 128
ssm_backend: auto
mlp_ratio: 4.0

active_blocks: all
right_flank_probability: 0.0

# 'layer_major' (default) scans the clean prefix once per layer and harvests
# every block's boundary state from it: 24 scan calls per micro-batch at
# L=8192/block 256 instead of 372, measured 3.80x on model fwd+bwd (LSF 102784).
# 'block_major' restores the original per-block loop; the two produce the same
# states and the same gradient, so this is a rollback switch, not a knob.
boundary_impl: layer_major

# Recompute the clean boundary prefill during backward instead of storing its
# activations. The prefill runs with gradients on and covers
# (num_blocks - 1) * block_size tokens in every layer, which is roughly half
# the token positions a training step touches, so it dominates peak memory.
# Memory -- not arithmetic -- is what pins the SSM arms to micro batch 4 while
# the Transformer trains at 8 (75.1 GiB vs 41.6 GiB at batch 4; batch 8 needs
# 137.45 of 143.77 GiB before optimizer state and OOMs). Recomputation is
# mathematically identical, asserted by
# tests/test_bissm_diffusion_integration.py, and costs about one extra forward
# over the prefix.
# 'auto' decides from the run's geometry at construction: recompute only when
# the activations it would save are >checkpoint_prefill_budget_frac of the
# device. Both branches are bitwise identical, so this can change time and
# memory but never a number. `true`/`false` still pin it.
checkpoint_boundary_prefill: auto
checkpoint_prefill_budget_frac: 0.20

# Ceilings on the SSM's initial state retention. Per-step retention is
# exp(A*dt) with A drawn from (1, ssm_a_init_max) and dt from
# (1e-3, ssm_dt_max), so lowering either initialises slower-decaying heads.
# Defaults reproduce the original hardcoded behaviour: at 16.0/0.1 the measured
# per-head half-life is 4.66 nt and no head reaches 256, while the C-a range
# measurement shows the data carries right-context value out to about 1 kb.
ssm_a_init_max: 16.0
ssm_dt_max: 0.1
