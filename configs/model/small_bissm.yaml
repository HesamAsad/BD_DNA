# Leakage-safe bidirectional Mamba-2 BD3-LM for single-nucleotide DNA.
#
# Hyperparameters follow the attached 87M partial-bidirectionality setup where
# possible: block 256 (set by the launch script), state 64, conv 4, expansion 2,
# and scan chunk 128. Width 768 keeps the parameter scale close to this repo's
# existing ~100M DNA baseline; use hidden_size=448 for the paper-width ablation.
name: small_bissm
type: bissm
hidden_size: 768
cond_dim: 128
length: 8192
n_blocks: 12
n_heads: 12                 # metadata / future hybrid-attention schedule
scale_by_sigma: True
dropout: 0.0
tie_word_embeddings: True
adaln: False
attn_backend: none

ssm_state_size: 64
ssm_conv_size: 4
ssm_expand: 2
ssm_head_dim: 64
ssm_chunk_size: 128
ssm_backend: auto            # fused upstream SSD scan on CUDA, torch in tests
mlp_ratio: 4.0

# 0 = valid de-novo objective. Set to 1 for the C-a conditional infilling run;
# intermediate values train one shared model with suffix-conditioning dropout.
right_flank_probability: 0.0
