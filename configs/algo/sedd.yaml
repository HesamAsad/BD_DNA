name: sedd
backbone: dit  # dit / dimamba
parameterization: sedd 
time_conditioning: True
T: 0  # 0 (continuous time) / 1000 
causal_attention: False
dropout: 0.0
ignore_bos: True
cross_attn: False
var_min: False
clip_search_delta: 0.05
clip_search_widths: []
clip_search_batches: 100   # validation batches feeding the variance search; each costs one forward PER WINDOW
fix_clipping: False
sampler: analytic
mdlm_loss_scale: False # set to true if using models from sahoo/lou et al