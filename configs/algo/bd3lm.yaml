name: bd3lm
backbone: dit  # dit / dimamba / hf_dit
parameterization: subs
time_conditioning: False
T: 0  # 0 (continuous time) / 1000 
causal_attention: False
dropout: 0.0
ignore_bos: True
cross_attn: True
var_min: True
clip_search_delta: 0.05
clip_search_widths: []
clip_search_batches: 100   # validation batches feeding the variance search; each costs one forward PER WINDOW
fix_clipping: False
sampler: semi_ar
mdlm_loss_scale: False
# Shuffle which (row, block) gets which antithetic noise stratum. False restores
# the pre-2026-09-16 behaviour, in which block 0 only ever saw 4 of 128 strata.
shuffle_antithetic_strata: true
